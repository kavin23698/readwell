<!doctype html>
<!-- Readwell app icon — option 1d "Book stack" (clay spines) from readwell/Readwell App Icon Options.html
     (Claude Design). Rendered to PNGs by scripts/build-icons.mjs; ?layer=full|bg|fg|mono|splash. -->
<html><head><meta charset="utf-8">
<style>
:root{
  --peri-400:#7486a8;--peri-700:#52568e;--indigo-800:#414484;
  --teal-400:#5a9fa9;--teal-700:#2e6a79;--sage-400:#539182;--sage-700:#2f5e57;
  --white:#ffffff;--ice-100:#e3eff5;--ice-200:#bdd6e2;--ice-300:#abc7d5;--warm-amber:#e9b77a;
  --texture-frost:radial-gradient(ellipse at 20% 0%,rgba(255,255,255,.35),transparent 55%),radial-gradient(ellipse at 100% 100%,rgba(30,50,70,.18),transparent 60%);
}
html,body{margin:0;width:1024px;height:1024px;overflow:hidden;background:transparent}
/* The design is 512px; everything is drawn at 512 and scaled 2x. */
.ic{position:absolute;left:0;top:0;width:512px;height:512px;overflow:hidden;transform:scale(2);transform-origin:0 0}
.bg{position:absolute;inset:0;background:radial-gradient(circle at 28% 18%,var(--peri-400) 0%,var(--peri-700) 50%,var(--indigo-800) 100%)}
.frost{position:absolute;inset:0;background:var(--texture-frost)}
.art{position:absolute;inset:0}
.plate{position:absolute;left:62px;top:62px;width:388px;height:388px;border-radius:96px;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.28);box-shadow:0 24px 48px -16px rgba(10,20,35,.55),inset 0 2px 0 rgba(255,255,255,.35),inset 0 -6px 16px rgba(20,36,52,.25)}
.bk{position:absolute;height:62px;border-radius:18px;box-shadow:0 10px 18px -6px rgba(10,20,35,.5),inset 0 2px 0 rgba(255,255,255,.45),inset 0 -4px 8px rgba(10,20,35,.25)}
.bk i{position:absolute;right:14px;top:10px;bottom:10px;width:44px;border-radius:8px;background:repeating-linear-gradient(180deg,var(--ice-100) 0 5px,var(--ice-300) 5px 7px);box-shadow:inset 0 2px 4px rgba(20,36,52,.25)}
.bk u{position:absolute;left:34px;top:0;bottom:0;width:18px;background:rgba(255,255,255,.28)}
.ribbon{position:absolute;background:linear-gradient(90deg,#d99b55,var(--warm-amber) 45%,#f3cc98);clip-path:polygon(0 0,100% 0,100% 100%,50% 88%,0 100%);filter:drop-shadow(0 4px 6px rgba(10,20,35,.35))}

/* Layers */
body.bg-only .art{display:none}
body.fg-only .bg,body.fg-only .frost{display:none}
/* Adaptive foreground: launchers show the centre 66%; shrink the art (plate spans 76%) to fit. */
body.fg-only .art,body.mono .art{transform:scale(.84);transform-origin:256px 256px}
/* Monochrome (Android 13+ themed icons): white silhouette of the three books. */
body.mono .bg,body.mono .frost,body.mono .plate,body.mono .ribbon,body.mono .bk i,body.mono .bk u{display:none}
body.mono .bk{background:#fff !important;box-shadow:none !important}
/* Splash: the art on its own (the splash background is navy). */
body.splash .bg,body.splash .frost{display:none}
</style></head>
<body>
<div class="ic">
  <div class="bg"></div><div class="frost"></div>
  <div class="art">
    <div class="plate"></div>
    <div class="bk" style="left:106px;top:322px;width:300px;background:linear-gradient(160deg,var(--teal-400),var(--teal-700))"><u></u><i></i></div>
    <div class="bk" style="left:126px;top:252px;width:268px;background:linear-gradient(160deg,var(--sage-400),var(--sage-700))"><u></u><i></i></div>
    <div class="bk" style="left:116px;top:182px;width:252px;background:linear-gradient(160deg,var(--white),var(--ice-300))"><u style="background:rgba(77,100,116,.18)"></u><i style="background:repeating-linear-gradient(180deg,var(--white) 0 5px,var(--ice-200) 5px 7px)"></i></div>
    <div class="ribbon" style="left:300px;top:226px;width:26px;height:80px"></div>
  </div>
</div>
<script>
  const layer = new URLSearchParams(location.search).get('layer') || 'full';
  document.body.className = { bg: 'bg-only', fg: 'fg-only', mono: 'mono', splash: 'splash' }[layer] || '';
</script>
</body></html>
